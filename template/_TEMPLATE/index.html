<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>NN Beat-Titel</title>
<!--
  ============================================================
  SKAILE B-ROLL MASTER-TEMPLATE (HyperFrames, 1920x1080, 5s)
  Diesen Ordner IMMER als Startpunkt kopieren, nie von Null bauen.
  Verbindlich: eine Metapher pro Beat, Motion bis Frame 150,
  KEINE Emojis (nur gezeichnete SVG/CSS-Visuals), heller BG.
  ============================================================
-->
<style>
/* ---- Fonts: IMMER lokal, nie Google-Fonts-@import (failt im Sandbox-Render) ---- */
@font-face{font-family:'Inter';font-style:normal;font-weight:400 800;font-display:block;src:url("assets/fonts/f0.woff2") format("woff2");}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 700;font-display:block;src:url("assets/fonts/f1.woff2") format("woff2");}
@font-face{font-family:'Newsreader';font-style:normal;font-weight:400 600;font-display:block;src:url("assets/fonts/f2.woff2") format("woff2");}

/* ---- Basis (nicht veraendern) ---- */
html,body{margin:0;padding:0;background:#FAF9F5;}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#FAF9F5;font-family:'Inter',sans-serif;}
.tex{position:absolute;inset:-10%;opacity:.5;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><g stroke='%23EBE7DD' stroke-width='2' fill='none' stroke-linecap='round'><path d='M40 120 Q 220 90 460 160'/><path d='M-20 360 Q 260 320 540 400'/><path d='M120 560 Q 320 520 600 600'/></g></svg>");background-size:600px 600px;}

/* ---- Kicker oben: Mono, gesperrt, EIN Kernwort coral via <b> ---- */
.kicker{position:absolute;top:176px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:21px;letter-spacing:.3em;color:#8A8578;white-space:nowrap;will-change:opacity,transform;}
.kicker b{color:#DA7756;}

/* ---- Karten-Grundstil: weisse Card, warmer Schatten ----
   Inhalt in Safe-Zone halten: x 360-1560 / y 240-890 (CapCut-Zoom-safe) */
.card{position:absolute;left:460px;top:260px;width:1000px;height:548px;background:#FFFFFF;border:1px solid #E8E4DA;border-radius:20px;box-shadow:0 44px 88px -34px rgba(60,50,35,.4);padding:26px 32px;box-sizing:border-box;will-change:transform,opacity;}

/* ---- Fenster-Leiste (fuer Editor/Terminal/Browser-Replicas) ---- */
.wbar{height:50px;background:#F3F1EC;border-bottom:1px solid #E6E3DA;display:flex;align-items:center;position:relative;margin:-26px -32px 20px;border-radius:20px 20px 0 0;}
.dots{display:flex;gap:8px;padding-left:18px;}
.dots i{width:12px;height:12px;border-radius:50%;display:inline-block;}
.dr{background:#F05A4F;}.dy{background:#F6BE3F;}.dg{background:#5FC15A;}
.wt{position:absolute;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:15px;color:#8A8578;font-weight:700;}

/* ---- Fill-Balken: FALLE! braucht display:block + width, sonst unsichtbar bei scaleX ---- */
.fill{display:block;width:100%;height:100%;border-radius:6px;background:#DA7756;transform:scaleX(0);transform-origin:left;will-change:transform;}

/* ---- Gauge-Nadel: FALLE! IMMER HTML-div, NIE SVG-<line> (rendert kaputt) ---- */
.needle{position:absolute;width:8px;height:150px;background:#161513;border-radius:4px;transform-origin:50% 100%;will-change:transform;}

/* ---- Bottom-Pill: dunkel, Spark, Mono gesperrt ---- */
.foot{position:absolute;left:50%;bottom:140px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:#141413;color:#FAF9F5;border-radius:100px;padding:15px 34px;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;letter-spacing:.14em;white-space:nowrap;will-change:transform,opacity;}
.foot .sp{color:#DA7756;font-size:26px;line-height:1;display:inline-block;will-change:transform;}
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-start="0" data-width="1920" data-height="1080" data-duration="5">
  <!-- Optional SFX (nur wenn gewuenscht): sfx.wav in den Ordner legen und hier ein
       audio-Element einfuegen mit: id sfx, data-start = Payoff-Sekunde, data-duration,
       data-track-index 1, src sfx.wav, data-volume 0.85 -->
  <div class="tex" data-layout-ignore></div>
  <div class="kicker" id="kick">KONTEXT&nbsp;GESPERRT&nbsp;&middot;&nbsp;<b>KERNWORT&nbsp;CORAL</b></div>

  <!-- ===== HIER die Metapher-Buehne bauen (eine Story ueber volle 5s) ===== -->
  <div class="card" id="card">
    <div class="wbar"><div class="dots"><i class="dr"></i><i class="dy"></i><i class="dg"></i></div><span class="wt">titel.md</span></div>
    <!-- Inhalt -->
  </div>

  <div class="foot" id="foot"><span class="sp" id="spF">&#10035;</span>PAYOFF&nbsp;IN&nbsp;3&ndash;5&nbsp;WORTEN</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
/* Regeln: paused:true + Registrierung Pflicht. Kein Math.random/Date.now.
   Kein repeat:-1 (immer endliche repeats). Keine relativen Werte (x:'+=') in
   keyframes-Ketten mit repeat. Kein zweiter Tween aufs selbe Property waehrend
   der erste noch laeuft (Cursor-Blink VOR dem Ausblenden enden lassen). */

/* Standard-Entrances (Zeiten anpassen, Eases variieren) */
tl.from('#kick',{y:-24,opacity:0,duration:.5,ease:'power2.out'},0.1);
tl.from('#card',{y:64,opacity:0,scale:.97,duration:.7,ease:'power3.out'},0.16);

/* ===== 0.6s-3.5s: Metapher spielt sich ab =====
   Counter-Rezept:  const o={v:0};
   tl.to(o,{v:96,duration:2,ease:'power1.inOut',onUpdate:()=>{el.textContent=Math.round(o.v)+'%';}},t);
   Tausender manuell formatieren (28,432 / 1.500), NIE toLocaleString.
   Typewriter:      tl.to(o,{i:txt.length,ease:'steps('+txt.length+')',onUpdate:...});
   SVG-draw:        strokeDasharray=len, strokeDashoffset len->0 (getTotalLength).
   Elemente die rausfliegen: danach tl.to(el,{opacity:0,duration:.001}). */

/* ===== 3.0s-5.0s: Payoff + Leben bis zum letzten Frame (Pflicht) ===== */
tl.from('#foot',{y:40,opacity:0,duration:.5,ease:'back.out(1.6)'},3.6);
tl.to('#spF',{rotation:200,duration:4.4,ease:'none'},0.4);
/* + mind. eins davon bis ~4.9s: Puls (yoyo repeat 2-3), Glow-Shadow, Counter-Endtick */

window.__timelines["root"] = tl;
</script>
</body>
</html>
