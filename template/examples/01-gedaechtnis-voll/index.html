<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>01 Gedächtnis wird voll</title>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:400 800;font-display:block;src:url("assets/fonts/f0.woff2") format("woff2");}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 700;font-display:block;src:url("assets/fonts/f1.woff2") format("woff2");}
html,body{margin:0;padding:0;background:#FAF9F5;}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#FAF9F5;font-family:'Inter',sans-serif;}
.tex{position:absolute;inset:-10%;opacity:.5;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><g stroke='%23EBE7DD' stroke-width='2' fill='none' stroke-linecap='round'><path d='M40 120 Q 220 90 460 160'/><path d='M-20 360 Q 260 320 540 400'/><path d='M120 560 Q 320 520 600 600'/></g></svg>");background-size:600px 600px;}
.kicker{position:absolute;top:176px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:21px;letter-spacing:.3em;color:#8A8578;white-space:nowrap;will-change:opacity,transform;}
.kicker b{color:#DA7756;}

.chat{position:absolute;left:360px;top:262px;width:700px;height:544px;background:#FFFFFF;border:1px solid #E8E4DA;border-radius:20px;box-shadow:0 44px 88px -34px rgba(60,50,35,.4);overflow:hidden;will-change:transform,opacity;}
.cb{height:50px;background:#F3F1EC;border-bottom:1px solid #E6E3DA;display:flex;align-items:center;position:relative;}
.dots{display:flex;gap:8px;padding-left:18px;}
.dots i{width:12px;height:12px;border-radius:50%;display:inline-block;}
.dr{background:#F05A4F;}.dy{background:#F6BE3F;}.dg{background:#5FC15A;}
.ct{position:absolute;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:15px;color:#8A8578;font-weight:700;}
.feed{position:absolute;left:0;right:0;top:50px;bottom:0;padding:20px 26px;overflow:hidden;}
.msgs{position:absolute;left:26px;right:26px;bottom:16px;will-change:transform;}
.m{border-radius:13px;padding:10px 15px;margin-top:11px;font-family:'Inter',sans-serif;font-size:15.5px;font-weight:600;max-width:78%;will-change:opacity,transform;opacity:0;}
.m.u{background:#141413;color:#FAF9F5;margin-left:auto;border-radius:13px 13px 4px 13px;}
.m.a{background:#F4F1EA;color:#3A3733;border-radius:13px 13px 13px 4px;}
.m .bar{display:block;height:9px;border-radius:5px;background:currentColor;opacity:.35;}

.mem{position:absolute;right:360px;top:262px;width:440px;height:544px;background:#FFFFFF;border:1px solid #E8E4DA;border-radius:22px;box-shadow:0 44px 88px -34px rgba(60,50,35,.4);padding:26px 32px;box-sizing:border-box;display:flex;flex-direction:column;will-change:transform,opacity;}
.mh{display:flex;align-items:center;gap:11px;font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.12em;color:#B0AB9E;text-transform:uppercase;}
.mh .sp{color:#DA7756;font-size:23px;line-height:1;display:inline-block;will-change:transform;}
.tank{flex:1;position:relative;margin:18px 0 16px;border:3px solid #E4E0D4;border-radius:18px;overflow:hidden;background:#FCFBF8;}
.fill{position:absolute;left:0;right:0;bottom:0;height:100%;background:linear-gradient(180deg,#DF5B4C 0%,#E9A07F 26%,#DA7756 60%,#E9C6B4 100%);transform:scaleY(.28);transform-origin:bottom;will-change:transform;}
.wave{position:absolute;left:-30px;right:-30px;height:16px;top:-8px;background:radial-gradient(circle at 10px 8px, rgba(250,249,245,.55) 6px, transparent 7px);background-size:26px 16px;}
.marks{position:absolute;inset:0;}
.mk{position:absolute;right:10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#B9B4A6;font-weight:700;}
.pct{display:flex;align-items:baseline;gap:10px;}
.pct .n{font-family:'Inter',sans-serif;font-weight:800;font-size:66px;letter-spacing:-.02em;line-height:1;color:#141413;font-variant-numeric:tabular-nums;will-change:color;}
.pct .l{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.1em;color:#8A8578;text-transform:uppercase;}
.warn{margin-top:12px;display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:#C23B2C;background:#FBE7E3;border:1.5px solid #EBB6AC;border-radius:100px;padding:8px 16px;opacity:0;will-change:opacity,transform;align-self:flex-start;}
.warn .d{width:9px;height:9px;border-radius:50%;background:#DF5B4C;will-change:opacity;}

.foot{position:absolute;left:50%;bottom:140px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:#141413;color:#FAF9F5;border-radius:100px;padding:15px 34px;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;letter-spacing:.14em;white-space:nowrap;will-change:transform,opacity;}
.foot .sp{color:#DA7756;font-size:26px;line-height:1;display:inline-block;will-change:transform;}
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-start="0" data-width="1920" data-height="1080" data-duration="5">
  <div class="tex" data-layout-ignore></div>
  <div class="kicker" id="kick">JE&nbsp;LÄNGER&nbsp;DER&nbsp;CHAT&nbsp;&middot;&nbsp;<b>DESTO&nbsp;VOLLER</b></div>

  <div class="chat" id="chat">
    <div class="cb"><div class="dots"><i class="dr"></i><i class="dy"></i><i class="dg"></i></div><span class="ct">Claude&nbsp;Code&nbsp;&mdash;&nbsp;laufender&nbsp;Chat</span></div>
    <div class="feed">
      <div class="msgs" id="msgs">
        <div class="m u" id="m1"><span class="bar" style="width:150px"></span></div>
        <div class="m a" id="m2"><span class="bar" style="width:290px"></span></div>
        <div class="m u" id="m3"><span class="bar" style="width:110px"></span></div>
        <div class="m a" id="m4"><span class="bar" style="width:330px"></span></div>
        <div class="m u" id="m5"><span class="bar" style="width:190px"></span></div>
        <div class="m a" id="m6"><span class="bar" style="width:260px"></span></div>
        <div class="m u" id="m7"><span class="bar" style="width:140px"></span></div>
        <div class="m a" id="m8"><span class="bar" style="width:310px"></span></div>
        <div class="m u" id="m9"><span class="bar" style="width:170px"></span></div>
        <div class="m a" id="m10"><span class="bar" style="width:280px"></span></div>
      </div>
    </div>
  </div>

  <div class="mem" id="mem">
    <div class="mh"><span class="sp" id="spM">&#10035;</span>Claudes&nbsp;Gedächtnis</div>
    <div class="tank">
      <div class="marks">
        <span class="mk" data-layout-allow-occlusion style="top:8%">100%</span>
        <span class="mk" data-layout-allow-occlusion style="top:33%">75%</span>
        <span class="mk" data-layout-allow-occlusion style="top:58%">50%</span>
        <span class="mk" data-layout-allow-occlusion style="top:83%">25%</span>
      </div>
      <div class="fill" id="fill"><div class="wave"></div></div>
    </div>
    <div class="pct"><span class="n" id="pn">28%</span><span class="l">belegt</span></div>
    <div class="warn" id="warn"><span class="d" id="wd"></span>WIRD&nbsp;KNAPP</div>
  </div>

  <div class="foot" id="foot"><span class="sp" id="spF">&#10035;</span>GEDÄCHTNIS&nbsp;LÄUFT&nbsp;VOLL</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });

tl.from('#kick',{y:-24,opacity:0,duration:.5,ease:'power2.out'},0.1);
tl.from('#chat',{x:-80,opacity:0,duration:.65,ease:'power3.out'},0.16);
tl.from('#mem',{x:80,opacity:0,duration:.65,ease:'power3.out'},0.3);

/* messages pour in fast, feed shifts up (msgs anchored bottom, new ones push) */
const msgs=['#m1','#m2','#m3','#m4','#m5','#m6','#m7','#m8','#m9','#m10'];
msgs.forEach((m,i)=>{
  tl.fromTo(m,{opacity:0,y:18,scale:.92},{opacity:1,y:0,scale:1,duration:.32,ease:'back.out(1.6)'},0.6+i*.34);
});

/* memory tank fills 28% -> 96%, number follows, color shifts */
tl.to('#fill',{scaleY:.96,duration:3.5,ease:'power1.inOut'},0.7);
const o={v:28};
tl.to(o,{v:96,duration:3.5,ease:'power1.inOut',onUpdate:()=>{document.getElementById('pn').textContent=Math.round(o.v)+'%';}},0.7);
tl.to('#pn',{color:'#C23B2C',duration:.5,ease:'power1.out'},3.4);

/* warning pops late + pulses */
tl.fromTo('#warn',{opacity:0,y:10,scale:.8},{opacity:1,y:0,scale:1,duration:.45,ease:'back.out(2)'},3.5);
tl.to('#wd',{opacity:.25,duration:.35,ease:'steps(1)',yoyo:true,repeat:3},3.8);
tl.fromTo('#mem',{},{x:4,duration:.06,yoyo:true,repeat:5,ease:'power1.inOut'},4.2);

tl.to('#spM',{rotation:220,duration:4.5,ease:'none'},0.4);
tl.from('#foot',{y:40,opacity:0,duration:.5,ease:'back.out(1.6)'},3.6);
tl.to('#spF',{rotation:200,duration:4.4,ease:'none'},0.4);
window.__timelines["root"] = tl;
</script>
</body>
</html>
